<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MarketPlace Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-auth">
                    <i class="fas fa-store"></i>
                    <span>MarketPlace Pro</span>
                </div>
                <h1>Connexion</h1>
                <p>Accédez à votre compte</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" name="email" placeholder="votre.email@example.com" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Se souvenir de moi</span>
                    </label>
                    <a href="#" class="forgot-password">Mot de passe oublié?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i>
                    Se Connecter
                </button>

                <span class="error-message" id="loginError" style="text-align: center; display: block; margin-top: 1rem;"></span>
            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <div class="social-login">
                <button class="social-btn facebook">
                    <i class="fab fa-facebook"></i>
                    Facebook
                </button>
                <button class="social-btn google">
                    <i class="fab fa-google"></i>
                    Google
                </button>
            </div>

            <div class="auth-footer">
                <p>Vous n'avez pas de compte? <a href="./signup.html" class="auth-link">S'inscrire</a></p>
                <p>Vous êtes fournisseur? <a href="./register-vendor.html" class="auth-link">Créer une boutique</a></p>
            </div>
        </div>

        <div class="auth-image">
            <div class="image-content">
                <i class="fas fa-lock-open"></i>
                <h2>Bienvenue Chez Nous</h2>
                <p>Accédez à vos commandes, profils et paramètres</p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
