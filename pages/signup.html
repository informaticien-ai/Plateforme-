<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MarketPlace Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-auth">
                    <i class="fas fa-store"></i>
                    <span>MarketPlace Pro</span>
                </div>
                <h1>Inscription Client</h1>
                <p>Créez votre compte pour commencer vos achats</p>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">
                            <i class="fas fa-user"></i>
                            Prénom
                        </label>
                        <input type="text" id="firstName" name="firstName" placeholder="Jean" required>
                        <span class="error-message" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">
                            <i class="fas fa-user"></i>
                            Nom
                        </label>
                        <input type="text" id="lastName" name="lastName" placeholder="Dupont" required>
                        <span class="error-message" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="signupEmail" name="email" placeholder="jean.dupont@example.com" required>
                    <span class="error-message" id="signupEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">
                        <i class="fas fa-phone"></i>
                        Téléphone
                    </label>
                    <input type="tel" id="phone" name="phone" placeholder="+221 77 123 45 67" required>
                    <span class="error-message" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="signupPassword">
                        <i class="fas fa-lock"></i>
                        Mot de passe
                    </label>
                    <div class="password-input-group">
                        <input type="password" id="signupPassword" name="password" placeholder="Min. 8 caractères" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signupPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar"><div class="strength-fill"></div></div>
                        <span class="strength-text">Faible</span>
                    </div>
                    <span class="error-message" id="signupPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="password-input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmez votre mot de passe" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" name="terms" id="terms" required>
                    <span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a></span>
                </label>
                <span class="error-message" id="termsError"></span>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i>
                    Créer mon compte
                </button>

                <span class="error-message" id="signupError" style="text-align: center; display: block; margin-top: 1rem;"></span>
            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <div class="social-login">
                <button class="social-btn facebook">
                    <i class="fab fa-facebook"></i>
                    Facebook
                </button>
                <button class="social-btn google">
                    <i class="fab fa-google"></i>
                    Google
                </button>
            </div>

            <div class="auth-footer">
                <p>Vous avez déjà un compte? <a href="./login.html" class="auth-link">Se connecter</a></p>
            </div>
        </div>

        <div class="auth-image">
            <div class="image-content">
                <i class="fas fa-shopping-cart"></i>
                <h2>Rejoignez Nous</h2>
                <p>Accédez aux meilleurs produits avec sécurité garantie</p>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
